name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python compiles
        run: python -m compileall -q reuse_lite scripts

      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Scan parity on CPU
        run: python scripts/test_scan.py

      - name: Shell scripts
        run: shellcheck -S warning run.sh scripts/*.sh web/start.command

      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/worker.js
          node --check scripts/web_check.mjs
